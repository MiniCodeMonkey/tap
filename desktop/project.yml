name: Tap
options:
  bundleIdPrefix: io.geocod.tap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TAP_VERSION: "0.0.0"
    MARKETING_VERSION: "$(TAP_VERSION)"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Benchmark:
      ENABLE_TESTABILITY: YES
    Release:
      # Notarization needs the hardened runtime. Debug and Benchmark keep it
      # off: a hardened test host refuses the injected test bundles.
      ENABLE_HARDENED_RUNTIME: YES
      # Apple silicon only: the bundled tap follows ARCHS in build-tap.sh,
      # and the cask and the appcast say so.
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
configs:
  Debug: debug
  Release: release
  Benchmark: release
packages:
  TapDesktopCore:
    path: TapDesktopCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Tap:
    type: application
    platform: macOS
    sources:
      - path: Tap
        excludes:
          - Info.plist
    dependencies:
      - package: TapDesktopCore
      - package: Sparkle
    info:
      path: Tap/Info.plist
      properties:
        CFBundleName: Tap
        CFBundleDisplayName: Tap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Tap records your voice with the screen when you record a talk.
        # Sparkle: the feed is the latest GitHub release's appcast, the key
        # checks every update's, the notes' and the feed's own EdDSA
        # signature, and the feed must carry one (which needs the update
        # verified before extraction). The private key never leaves the
        # person's keychain and CI's secret.
        SUFeedURL: https://github.com/MiniCodeMonkey/tap/releases/latest/download/appcast.xml
        SUPublicEDKey: Pc0PbtYL9fkyK3XnqULlpKLlH94TE4OWx4Q3n74EftU=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Deck
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
            NSDocumentClass: "$(PRODUCT_MODULE_NAME).DeckDocument"
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.geocod.tap.desktop
        PRODUCT_NAME: Tap
        CODE_SIGN_ENTITLEMENTS: Tap/Tap.entitlements
    postCompileScripts:
      - name: Bundle tap
        path: scripts/build-tap.sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/tap
      - name: Bundle theme thumbnails
        path: scripts/build-theme-thumbnails.sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ThemeThumbnails/catalog.json
  TapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TapTests
        excludes:
          - Fixtures/**
    dependencies:
      - target: Tap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.geocod.tap.desktop.tests
  TapUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TapUITests
    dependencies:
      - target: Tap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.geocod.tap.desktop.uitests
  TapBenchmarks:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TapBenchmarks
        excludes:
          - Decks/**
    dependencies:
      - target: Tap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.geocod.tap.desktop.benchmarks
schemes:
  Tap:
    build:
      targets:
        Tap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TapTests
        - TapUITests
  TapBenchmarks:
    build:
      targets:
        Tap: all
        TapBenchmarks: [test]
    test:
      config: Benchmark
      targets:
        - TapBenchmarks
