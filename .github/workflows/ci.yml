name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Determine playwright-go version
        id: playwright-go
        run: |
          version=$(grep -m1 'github.com/mxschmitt/playwright-go ' go.mod | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # internal/pdf and internal/cli drive a real Chromium through
      # playwright-go: cache its driver and browser download, keyed on the
      # playwright-go version pinned in go.mod, so a normal run reuses
      # yesterday's download instead of re-fetching ~250MB of Chromium.
      - name: Cache Playwright driver and browser
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright-go
            ~/.cache/ms-playwright
          key: playwright-go-${{ runner.os }}-${{ steps.playwright-go.outputs.version }}

      # Chromium needs a handful of system libraries ubuntu-latest doesn't
      # ship by default (libnss3, libatk, libgtk, etc). The frontend's own
      # @playwright/test dependency already carries the `install-deps`
      # subcommand, so reuse it rather than hand-maintaining an apt list
      # that drifts from whatever Ubuntu image GitHub ships next.
      - name: Install Chromium system dependencies
        run: cd frontend && npx playwright install-deps chromium

      - name: Run go vet
        run: go vet ./...

      # CI is set by GitHub Actions, which flips the browser-availability
      # skip in internal/cli's pdf and screenshot tests into a hard
      # failure instead of a silent skip (see browser_test_helper_test.go),
      # so a broken browser install shows up as a red build here.
      - name: Run Go tests
        run: go test ./...

      - name: Check that the release version flag reaches the binary
        run: |
          go build -ldflags "-X github.com/MiniCodeMonkey/tap/internal/cli.Version=9.9.9-ci" -o /tmp/tap-version-check ./cmd/tap
          test "$(/tmp/tap-version-check --version)" = "tap version 9.9.9-ci"

      - name: Run Go linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run unit tests
        run: cd frontend && npm run test

      - name: Run type check
        run: cd frontend && npm run check

      - name: Run linter
        run: cd frontend && npm run lint

      - name: Check theme tokens are up to date
        run: cd frontend && npm run tokens:check

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Builds the frontend into embedded/dist, then the tap binary, the
      # same two steps `make build` always runs - playwright.config.ts's
      # webServer runs the dev server with `go run`, not the built
      # binary, but both need the frontend already built into
      # embedded/dist.
      - name: Build frontend and tap binary
        run: make build

      - name: Cache Playwright browser (frontend)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  test-themes:
    name: Theme Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Cache Playwright browser (frontend)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      # Build the binary in its own step rather than starting it through
      # `go run`. This job never runs `make build` (unlike test-e2e), so on
      # a cold Go build cache `go run` compiles silently for a while before
      # the server ever starts, and the poll below timed out against an
      # empty log during that compile.
      - name: Build tap binary
        run: go build -o /tmp/tap ./cmd/tap

      # The theme suite needs its own Go dev server and Vite dev server,
      # each on their own port, the same pair CONTRIBUTING.md documents
      # for a local run (see "Testing the Theme Suite").
      - name: Start tap dev server
        run: |
          nohup /tmp/tap dev testdata/themes.md --port 3300 --headless > /tmp/tap-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3300 > /dev/null && exit 0
            sleep 1
          done
          echo "tap dev server did not come up"
          cat /tmp/tap-dev.log
          ss -ltnp || lsof -i :3300
          exit 1

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          TAP_API_PORT=3300 nohup npx vite --port 5300 > /tmp/vite-dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5300 > /dev/null && exit 0
            sleep 1
          done
          echo "vite dev server did not come up"; cat /tmp/vite-dev.log; exit 1

      # The visual snapshots under frontend/e2e-themes/__snapshots__/ were
      # rendered on macOS and never match Linux font rendering pixel for
      # pixel, so TAP_THEME_SNAPSHOTS=off skips only that comparison (see
      # themes.spec.ts). Overflow, clipping, minimum text size, contrast,
      # and the theme-isolation check all still run, for every theme.
      - name: Run theme checks
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5300
          TAP_THEME_SNAPSHOTS: 'off'
        run: npx playwright test -c playwright.themes.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: theme-checks-report
          path: frontend/playwright-report/
          retention-days: 14

  test-desktop:
    name: Desktop Tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The desktop app lives on feat/desktop-app-shell and is not yet
      # merged to main, so `desktop/` does not exist here. Every step below
      # is gated on this check rather than on a path filter, so that once
      # the app lands, a change anywhere (Go, frontend) that breaks it is
      # caught too, not only a change under desktop/ itself.
      - name: Check for desktop app
        id: check-desktop
        run: |
          if [ -d desktop ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "desktop/ is absent on this branch; skipping desktop tests."
          fi

      # check-scenarios.sh is plain sh over text files (the manifest, the
      # feature files, the Swift test sources), with no Xcode or frontend
      # build dependency, so it runs first and fails fast, before the
      # slower steps below spend time on a build.
      - name: Check that every claimed scenario has a test
        if: steps.check-desktop.outputs.exists == 'true'
        run: make -C desktop check-scenarios

      - name: Select Xcode
        if: steps.check-desktop.outputs.exists == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up Go
        if: steps.check-desktop.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        if: steps.check-desktop.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install xcodegen
        if: steps.check-desktop.outputs.exists == 'true'
        run: brew install xcodegen

      # TapDesktopCore has no external Swift package dependencies, so the
      # only thing worth caching here is its own compiled build products,
      # not any resolved-package store.
      - name: Cache TapDesktopCore build
        if: steps.check-desktop.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: desktop/TapDesktopCore/.build
          key: desktop-core-${{ runner.os }}-${{ hashFiles('desktop/TapDesktopCore/**/*.swift', 'desktop/TapDesktopCore/Package.swift') }}
          restore-keys: |
            desktop-core-${{ runner.os }}-

      # The Tap.app build (hosted tests run inside it) is the slow part:
      # cache its DerivedData so an unrelated change elsewhere in the repo
      # does not force a full Swift recompile of the app every run. Keyed
      # on the app sources and project spec, with a restore-key fallback
      # so a miss still seeds from the last cache rather than starting
      # cold.
      - name: Cache Tap.app DerivedData
        if: steps.check-desktop.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: desktop/build/DerivedData
          key: desktop-deriveddata-${{ runner.os }}-${{ hashFiles('desktop/Tap/**/*.swift', 'desktop/TapTests/**/*.swift', 'desktop/project.yml') }}
          restore-keys: |
            desktop-deriveddata-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.check-desktop.outputs.exists == 'true'
        run: cd frontend && npm ci

      # build-tap.sh (run as an Xcode build phase for the Tap target)
      # refuses to build tap when anything under frontend/ is newer than
      # embedded/dist, so the frontend has to be built before `make -C
      # desktop build` or `make -C desktop test` ever invokes Xcode.
      - name: Build frontend
        if: steps.check-desktop.outputs.exists == 'true'
        run: make frontend

      # Pure logic, no windows: ~111 tests over the TapDesktopCore Swift
      # package, run directly with `swift test`.
      - name: Run TapDesktopCore tests
        if: steps.check-desktop.outputs.exists == 'true'
        run: make -C desktop core-test

      # Test-only hooks are compiled out of release builds; this fails if
      # one reaches the release app.
      - name: Check that test hooks stay out of the release build
        if: steps.check-desktop.outputs.exists == 'true'
        run: make -C desktop check-release-hooks

      # ~47 tests hosted inside the real Tap.app, driving a real `tap dev
      # --app`. These open real windows (see TapTests/Support/
      # HostedTestCase.swift), so they need a window server. GitHub-hosted
      # macOS runners run the job inside a logged-in GUI session with
      # WindowServer already up (this is not the Linux-style headless case
      # that needs Xvfb), so no extra setup for a display was added here.
      # That said, this has not been exercised against the real desktop
      # app yet: this job cannot prove it works until feat/desktop-app-
      # shell merges and this step actually runs instead of being skipped.
      - name: Run hosted Tap.app tests
        if: steps.check-desktop.outputs.exists == 'true'
        run: make -C desktop test

      # A failed hosted run keeps what classifies a web content process
      # that stopped answering: WebKit's and RunningBoard's log of the last
      # 30 minutes (process launch, suspend and resume, which the test
      # output does not carry) with the memorystatus (jetsam) lines, any
      # WebContent crash or hang report, and the spindumps the tests saved
      # on a first ready that never came.
      - name: Collect WebKit diagnostics
        if: failure() && steps.check-desktop.outputs.exists == 'true'
        run: |
          mkdir -p webkit-diagnostics
          log show --last 30m --style compact --predicate 'subsystem == "com.apple.WebKit" OR process == "runningboardd" OR eventMessage CONTAINS "memorystatus"' > webkit-diagnostics/webkit-and-runningboard.log 2>&1 || true
          for folder in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$folder" -iname '*WebContent*' -exec cp {} webkit-diagnostics/ \; 2>/dev/null || true
          done
          cp -R "$HOME/Library/Logs/TapTests" webkit-diagnostics/ 2>/dev/null || true
          ls -la webkit-diagnostics

      - name: Upload WebKit diagnostics
        if: failure() && steps.check-desktop.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-webkit-diagnostics
          path: webkit-diagnostics/
          retention-days: 14

  # The XCUITests drive the real app with the real pointer, so they run
  # here rather than on a person's Mac, where they take over the screen.
  # XCUITest needs automation mode; the runner has passwordless sudo, so
  # it is enabled without a prompt before the tests start.
  test-desktop-ui:
    name: Desktop UI Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: make frontend

      - name: Enable automation mode
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Run UI tests
        run: make -C desktop uitest

  # The benchmarks measure typing, preview and thumbnail times against
  # bounds set on a developer Mac. A shared runner's speed varies, so a
  # slow run reports its numbers here without failing the workflow.
  bench-desktop:
    name: Desktop Benchmarks
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: make frontend

      - name: Run benchmarks
        run: make -C desktop bench
