name: Mutations

# A branch named mutations/<anything> carries mutation patches under
# mutations/ (see desktop/scripts/run-mutations.sh). Hosted tests open
# windows, so mutations that need them run here, on the macOS runner,
# rather than on a person's Mac.
on:
  push:
    branches: ['mutations/**']

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutations:
    name: Desktop Mutations
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: make frontend

      - name: Run the mutations
        run: MUTATION_REPORT="$GITHUB_STEP_SUMMARY" sh desktop/scripts/run-mutations.sh
